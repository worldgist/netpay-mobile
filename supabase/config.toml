[auth]
site_url = "https://netppay.com"
additional_redirect_urls = [
  "https://netppay.com/**",
  "https://www.netppay.com/**",
  "netpay://**",
  "http://127.0.0.1:3000/**",
  "http://localhost:3000/**",
]

[auth.email]
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Your NetPay verification code"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.recovery]
subject = "Reset your NetPay password"
content_path = "./supabase/templates/reset-password.html"

